services:
  bot:
    build: .
    env_file: .env
    environment:
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - WAZZUP_WEBHOOK_PORT=${WAZZUP_WEBHOOK_PORT:-8080}
      # For local dev override the image defaults so writable state lives
      # under ./data (the host bind-mount) and videos under ./data/videos.
      # On Railway you'd leave the image defaults (STATE_DIR=/app/state,
      # VIDEOS_DIR=/app/media-videos).
      - STATE_DIR=/app/data
      - VIDEOS_DIR=/app/data/videos
    volumes:
      - ./data:/app/data                       # state (DB/chroma/logs) + videos
      - ./knowledge_base:/app/knowledge_base   # live-reload KB without rebuild
    ports:
      - "${WAZZUP_WEBHOOK_PORT:-8080}:8080"
    restart: unless-stopped
    # Compose-level healthcheck mirrors the Dockerfile one; compose can act
    # on the result (e.g. `depends_on: condition: service_healthy`).
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || pgrep -f 'python.*main.py' >/dev/null"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  screening:
    build: .
    command: ["python", "screening/app.py"]
    environment:
      - SCREENING_PORT=5050
      - SCREENING_DB_PATH=/app/data/screening.db
    volumes:
      - ./data:/app/data
    ports:
      - "5050:5050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
